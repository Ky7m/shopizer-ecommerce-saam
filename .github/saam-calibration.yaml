# ─────────────────────────────────────────────────────────────
# GOVERNANCE (Invisible Risk-Adaptive Controls)
# Used by: .github/skills/saam-governance/SKILL.md, reconcile_validation.py, spec_drift.py
# Governance is NOT a choice — it's determined automatically from:
#   1. Whether BR-ID code was touched (detect_br_ids)
#   2. Whether spec hash matches (spec_drift)
#   3. Whether affected BR-ID is Critical (graph classification)
# ─────────────────────────────────────────────────────────────
# BR-ID PATTERN (Single Source of Truth)
# Used by: detect_br_ids.py, run-and-reconcile.sh, CI workflows,
#          Validator subagent, grep-based verification gates
# All components that detect/match BR-IDs MUST use this pattern.
# ─────────────────────────────────────────────────────────────
br_id_pattern:
  # Regex (POSIX extended — works in grep -E, Python re, JavaScript)
  # The middle GROUP segment is OPTIONAL — BOTH conventions are valid:
  #   3-segment: BR-<DOMAIN>-<GROUP>-<NUMBER>   e.g. BR-GL-PST-001, BR-AP-VAL-012
  #   flat:      BR-<DOMAIN>-<NUMBER>           e.g. BR-AP-001, BR-HR-032
  regex: "BR-[A-Z]{2,6}(?:-[A-Z]{2,6})?-[0-9]{2,3}"
  # Structure: BR-<DOMAIN>[-<GROUP>]-<NUMBER>
  # Domain: 2-6 uppercase letters (GL, AP, AR, JC, PR, TEAM, COMPLY, etc.)
  # Group (OPTIONAL): 2-6 uppercase letters (PST, VAL, CRT, MATCH, CLAIM, etc.)
  # Number: 2-3 digits (01-999)
  # NOTE (governance decision): the flat 2-segment form is an accepted convention, not just the
  # 3-segment form — both appear across services in real engagements and rewriting IDs to force one
  # form is disproportionate (churns committed services + the graph). The single-source pattern admits
  # both. ALL BR-ID detection/matching MUST read THIS key — no script may hardcode its own pattern
  # (three divergent hardcoded patterns previously caused a Phase-5 silent-miss on flat IDs).

  # Strict mode (for CI — rejects partial matches; group still optional)
  regex_strict: "^BR-[A-Z]{2,6}(?:-[A-Z]{2,6})?-[0-9]{2,3}$"

  # Tolerant mode (for detection in comments — allows surrounding text; identical body to `regex`)
  regex_tolerant: "BR-[A-Z]{2,6}(?:-[A-Z]{2,6})?-[0-9]{2,3}"

# ─────────────────────────────────────────────────────────────
# GOVERNANCE (Invisible Risk-Adaptive Controls)
governance:
  # Governance levels (determined automatically, never selected by developer)
  levels:
    passthrough:
      trigger: "No BR-IDs in changed files"
      requires_tests: true
      requires_spec_check: false
      requires_graph_update: false
      requires_human_approval: false
    automated_check:
      trigger: "BR-IDs touched, spec hash matches"
      requires_tests: true
      requires_spec_check: true            # hash comparison — automated
      requires_graph_update: true           # CLAIMS_IMPLEMENTATION updated
      requires_human_approval: false
    drift_response:
      trigger: "BR-IDs touched, spec hash DOES NOT match"
      requires_tests: true
      requires_spec_check: true
      requires_graph_update: true
      requires_human_approval: false
      requires_reconciliation: true         # must update code or spec to align
      creates_deviation: true               # SPEC_DRIFT deviation node
    critical_gate:
      trigger: "Critical BR-ID affected + spec drift detected"
      requires_tests: true
      requires_spec_check: true
      requires_graph_update: true
      requires_human_approval: true         # merge/deploy blocked
      requires_reconciliation: true
      creates_deviation: true

  # What makes a BR-ID "Critical" (from Phase 4a classification)
  critical_classifications: ["Core"]
  critical_weights: ["Critical"]

  # Drift detection parameters
  drift:
    hash_algorithm: "sha256_first16"       # first 16 chars of SHA256
    normalization: "strip_trailing_whitespace_collapse_blanks"
    auto_baseline_on_spec_edit: false       # must explicitly run --update
