$schema: https://json-schema.org/draft/2020-12/schema
title: BusinessIntegrationDeliveryRequested
type: object
required: [eventId, eventType, occurredAt, tenantId, storeId, correlationId, idempotencyKey, deliveryType, endpointCode, payload]
properties:
  eventId: {type: string}
  eventType: {type: string}
  occurredAt: {type: string, format: date-time}
  tenantId: {type: string}
  storeId: {type: string}
  correlationId: {type: string}
  idempotencyKey: {type: string}
  deliveryType: {type: string, enum: [Email, StorageUpload, StorageBatchUpload]}
  endpointCode: {type: string}
  businessReference: {type: string}
  payload: {type: object, additionalProperties: true}

