$schema: https://json-schema.org/draft/2020-12/schema
title: BusinessIntegrationDeliveryRequested
type: object
allOf:
  - $ref: ../common-schemas.yaml#/components/schemas/EventMetadata
  - type: object
    required: [eventType, eventVersion, idempotencyKey, deliveryType, endpointCode, payload]
    properties:
      eventType: {const: BusinessIntegrationDeliveryRequested}
      eventVersion: {const: 1}
      idempotencyKey: {type: string}
      deliveryType: {type: string, enum: [Email, StorageUpload, StorageBatchUpload]}
      endpointCode: {type: string}
      businessReference: {type: string}
      payload: {type: object, additionalProperties: true}
