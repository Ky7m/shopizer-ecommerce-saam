$schema: https://json-schema.org/draft/2020-12/schema
title: PaymentAuthorizationStarted
type: object
x-contract-status: DEAD/UNCONSUMED
description: Sequence-only payment progress event with no confirmed consumer.
allOf:
  - $ref: ../common-schemas.yaml#/components/schemas/EventMetadata
  - type: object
    required: [eventType, eventVersion, paymentIntentId, orderId, amount, currency]
    properties:
      eventType: {const: PaymentAuthorizationStarted}
      eventVersion: {const: 1}
      paymentIntentId: {type: string}
      orderId: {type: string}
      amount: {type: string}
      currency: {type: string}
