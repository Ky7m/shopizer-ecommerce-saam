$schema: https://json-schema.org/draft/2020-12/schema
title: OrderSubmitted.v1
type: object
allOf:
  - $ref: ../common-schemas.yaml#/components/schemas/EventMetadata
  - type: object
    required: [eventType, eventVersion, submissionId, currency, total, lines]
    properties:
      eventType: {const: OrderSubmitted.v1}
      eventVersion: {const: 1}
      submissionId: {type: string}
      customerId: {type: [integer, string, "null"]}
      currency: {type: string}
      total: {type: number}
      lines:
        type: array
        items:
          type: object
          required: [sku, productName, quantity, unitPrice, attributes]
          properties:
            sku: {type: string}
            productName: {type: string}
            quantity: {type: integer}
            unitPrice: {type: number}
            attributes:
              type: array
              items:
                $ref: ../../microservices/ms-04/04-api-contract.yaml#/components/schemas/CartAttributeReference
