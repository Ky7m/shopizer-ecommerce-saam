$schema: https://json-schema.org/draft/2020-12/schema
title: OrderCanceled
type: object
allOf:
  - $ref: ../common-schemas.yaml#/components/schemas/EventMetadata
  - type: object
    required: [eventType, eventVersion, orderId, previousStatus, status, reason, compensationState]
    properties:
      eventType: {const: OrderCanceled}
      eventVersion: {const: 1}
      orderId: {type: integer}
      previousStatus: {type: string, enum: [Ordered, Processed]}
      status: {const: Canceled}
      reason: {type: string}
      compensationState: {type: string, enum: [Pending, Completed, Failed]}
