$schema: https://json-schema.org/draft/2020-12/schema
title: IntegrationDeliveryQueued
type: object
x-contract-status: DEAD/UNCONSUMED
description: Internal operational event has no separate consumer; the MS-12 delivery worker handles the committed outbox record.
allOf:
  - $ref: ../common-schemas.yaml#/components/schemas/EventMetadata
  - type: object
    required: [eventType, eventVersion, operationId, attemptId, endpointId, idempotencyKey, availableAt, requestPayload]
    properties:
      eventType: {const: IntegrationDeliveryQueued}
      eventVersion: {const: 1}
      operationId: {type: string, format: uuid}
      attemptId: {type: string, format: uuid}
      endpointId: {type: string, format: uuid}
      idempotencyKey: {type: string}
      availableAt: {type: string, format: date-time}
      requestPayload: {type: object, additionalProperties: true}
