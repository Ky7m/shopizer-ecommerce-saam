$schema: https://json-schema.org/draft/2020-12/schema
title: PaymentFailed.v1
type: object
allOf:
  - $ref: ../common-schemas.yaml#/components/schemas/EventMetadata
  - type: object
    required: [eventType, eventVersion, paymentIntentId, orderId, amount, currency, errorCode]
    properties:
      eventType: {const: PaymentFailed.v1}
      eventVersion: {const: 1}
      paymentIntentId: {type: string}
      orderId: {type: string}
      amount: {type: string}
      currency: {type: string}
      errorCode: {type: string}
      providerReference: {type: [string, "null"]}
