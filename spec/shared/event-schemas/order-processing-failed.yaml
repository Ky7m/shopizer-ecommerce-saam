$schema: https://json-schema.org/draft/2020-12/schema
title: OrderProcessingFailed
type: object
allOf:
  - $ref: ../common-schemas.yaml#/components/schemas/EventMetadata
  - type: object
    required: [eventType, eventVersion, failureCode]
    properties:
      eventType: {const: OrderProcessingFailed}
      eventVersion: {const: 1}
      orderId: {type: [integer, "null"]}
      submissionId: {type: [string, "null"]}
      failureCode: {type: string}
      message: {type: string}
