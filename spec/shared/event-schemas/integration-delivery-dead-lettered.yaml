$schema: https://json-schema.org/draft/2020-12/schema
title: IntegrationDeliveryDeadLettered
type: object
allOf:
  - $ref: ../common-schemas.yaml#/components/schemas/EventMetadata
  - type: object
    required: [eventType, eventVersion, operationId, attemptId, endpointId, idempotencyKey, attemptNumber, deadLetteredAt]
    properties:
      eventType: {const: IntegrationDeliveryDeadLettered}
      eventVersion: {const: 1}
      operationId: {type: string, format: uuid}
      attemptId: {type: string, format: uuid}
      messageId: {type: string, format: uuid}
      endpointId: {type: string, format: uuid}
      idempotencyKey: {type: string}
      attemptNumber: {type: integer}
      deadLetteredAt: {type: string, format: date-time}
