$schema: https://json-schema.org/draft/2020-12/schema
title: OrderPaymentFailed
type: object
allOf:
  - $ref: ../common-schemas.yaml#/components/schemas/EventMetadata
  - type: object
    required: [eventType, eventVersion, orderId, paymentIntentId, errorCode]
    properties:
      eventType: {const: OrderPaymentFailed}
      eventVersion: {const: 1}
      orderId: {type: integer}
      paymentIntentId: {type: string}
      errorCode: {type: string}
      paymentReference: {type: [string, "null"]}
