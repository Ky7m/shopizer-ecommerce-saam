$schema: https://json-schema.org/draft/2020-12/schema
title: IntegrationDeliveryReplayRequested
type: object
required: [eventId, eventType, occurredAt, tenantId, storeId, correlationId, originalAttemptId, reason]
properties:
  eventId: {type: string}
  eventType: {type: string}
  occurredAt: {type: string, format: date-time}
  tenantId: {type: string}
  storeId: {type: string}
  correlationId: {type: string}
  originalAttemptId: {type: string, format: uuid}
  reason: {type: string}

