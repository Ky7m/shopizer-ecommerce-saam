$schema: https://json-schema.org/draft/2020-12/schema
title: OrderAccepted
type: object
allOf:
  - $ref: ../common-schemas.yaml#/components/schemas/EventMetadata
  - type: object
    required: [eventType, eventVersion, orderId, status, currency, total, lines]
    properties:
      eventType: {const: OrderAccepted}
      eventVersion: {const: 1}
      orderId: {type: integer}
      status: {const: Ordered}
      currency: {type: string}
      total: {type: number, minimum: 0}
      lines:
        type: array
        items:
          $ref: ../../microservices/ms-05/04-api-contract.yaml#/components/schemas/OrderLine
