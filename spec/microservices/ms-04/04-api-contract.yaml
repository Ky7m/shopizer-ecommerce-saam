openapi: "3.1.0"
info:
  title: Cart and Checkout API
  version: "1.0.0"
  description: |
    API contract for MS-04 Cart and Checkout.
    This contract is the single authority for endpoint paths, field names,
    request bodies, response bodies, and status codes.
servers:
  - url: http://localhost:{port}/api/v1
    variables:
      port:
        default: "8084"

x-naming-conventions:
  fieldNaming: camelCase
  endpointNaming: kebab-case
  headerNaming: kebab-case
  enumValues: PascalCase
  queryParams: camelCase

x-global-headers:
  - name: x-tenant-id
    required: true
    description: Tenant isolation identifier
    testValue: tenant-001
  - name: x-store-id
    required: true
    description: Store isolation identifier
    testValue: store-001
  - name: x-correlation-id
    required: true
    description: Distributed tracing identifier
    testValue: 00000000-0000-0000-0000-000000000001

paths:
  /cart:
    post:
      operationId: createOrAddCartItem
      summary: Create a cart or add an item to a new anonymous cart
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/StoreId"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddCartItemRequest"
      responses:
        "201":
          description: Cart created or item added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"

  /cart/{code}:
    parameters:
      - $ref: "#/components/parameters/CartCode"
    get:
      operationId: getCart
      summary: Retrieve and hydrate a cart
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/StoreId"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Hydrated cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartEnvelope"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      operationId: updateCartItem
      summary: Replace one cart line quantity
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/StoreId"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCartItemRequest"
      responses:
        "200":
          description: Updated cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"

  /cart/{code}/multi:
    parameters:
      - $ref: "#/components/parameters/CartCode"
    post:
      operationId: updateMultipleCartItems
      summary: Apply partial changes to multiple cart lines
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/StoreId"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              items:
                $ref: "#/components/schemas/MultiCartItemRequest"
      responses:
        "200":
          description: Updated cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"

  /cart/{code}/promo/{promoCode}:
    parameters:
      - $ref: "#/components/parameters/CartCode"
      - $ref: "#/components/parameters/PromoCode"
    post:
      operationId: applyCartPromotion
      summary: Store a promotion code and recalculate the cart
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/StoreId"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Cart with promotion state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartEnvelope"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"

  /cart/{code}/product/{sku}:
    parameters:
      - $ref: "#/components/parameters/CartCode"
      - $ref: "#/components/parameters/Sku"
    delete:
      operationId: removeCartItem
      summary: Remove a product line and its selected attributes
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/StoreId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/ReturnCart"
      responses:
        "200":
          description: Remaining cart when body=true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartEnvelope"
        "204":
          description: Item removed with no response body
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /customers/{id}/cart:
    parameters:
      - $ref: "#/components/parameters/CustomerId"
    post:
      operationId: deprecatedCustomerCartAdd
      summary: Deprecated customer-ID cart endpoint
      deprecated: true
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/StoreId"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddCartItemRequest"
      responses:
        "410":
          description: Endpoint is no longer supported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /auth/customer/{id}/cart:
    parameters:
      - $ref: "#/components/parameters/CustomerId"
    get:
      operationId: getAuthenticatedCustomerCartById
      summary: Deprecated authenticated customer-ID cart lookup
      deprecated: true
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/StoreId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/Authorization"
        - $ref: "#/components/parameters/OptionalCartCode"
      responses:
        "200":
          description: Customer cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /auth/customer/cart:
    get:
      operationId: getAuthenticatedCustomerCart
      summary: Retrieve the authenticated customer's cart
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/StoreId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/Authorization"
        - $ref: "#/components/parameters/OptionalCartCode"
      responses:
        "200":
          description: Customer cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/cart/{code}/checkout:
    parameters:
      - $ref: "#/components/parameters/CartCode"
    post:
      operationId: submitAuthenticatedCheckout
      summary: Freeze and submit an authenticated checkout
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/StoreId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/Authorization"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthenticatedCheckoutRequest"
      responses:
        "202":
          description: Checkout accepted for downstream processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutSubmissionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /cart/{code}/checkout:
    parameters:
      - $ref: "#/components/parameters/CartCode"
    post:
      operationId: submitAnonymousCheckout
      summary: Freeze and submit an anonymous checkout
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/StoreId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnonymousCheckoutRequest"
      responses:
        "202":
          description: Checkout accepted for downstream processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutSubmissionResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /auth/cart/{code}/shipping:
    parameters:
      - $ref: "#/components/parameters/CartCode"
    get:
      operationId: getAuthenticatedShippingOptions
      summary: Calculate shipping options using the authenticated customer's address
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/StoreId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/Authorization"
      responses:
        "200":
          description: Shipping options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShippingSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /cart/{code}/shipping:
    parameters:
      - $ref: "#/components/parameters/CartCode"
    post:
      operationId: calculateAnonymousShippingOptions
      summary: Calculate shipping options from a postal and country address
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/StoreId"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShippingAddressRequest"
      responses:
        "200":
          description: Shipping options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShippingSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /auth/cart/{id}/total:
    parameters:
      - $ref: "#/components/parameters/CartId"
    get:
      operationId: calculateAuthenticatedCartTotal
      summary: Calculate totals for an authenticated customer's cart
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/StoreId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/Authorization"
        - $ref: "#/components/parameters/OptionalQuoteId"
      responses:
        "200":
          description: Calculated totals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TotalSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /cart/{code}/total:
    parameters:
      - $ref: "#/components/parameters/CartCode"
    get:
      operationId: calculateCartTotal
      summary: Calculate totals for a cart
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/StoreId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/OptionalQuoteId"
      responses:
        "200":
          description: Calculated totals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TotalSummary"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /auth/cart/{code}/payment/init:
    parameters:
      - $ref: "#/components/parameters/CartCode"
    post:
      operationId: initializeAuthenticatedPayment
      summary: Initialize payment handoff for an authenticated cart
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/StoreId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/Authorization"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentInitializationRequest"
      responses:
        "202":
          description: Payment initialization accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentInitializationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /cart/{code}/payment/init:
    parameters:
      - $ref: "#/components/parameters/CartCode"
    post:
      operationId: initializePayment
      summary: Initialize payment handoff for a cart
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/StoreId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentInitializationRequest"
      responses:
        "202":
          description: Payment initialization accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentInitializationResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

components:
  securitySchemes:
    bearerAuth:
      $ref: '../../shared/common-schemas.yaml#/components/securitySchemes/bearerAuth'
  parameters:
    TenantId:
      $ref: '../../shared/common-schemas.yaml#/components/parameters/TenantId'
    StoreId:
      $ref: '../../shared/common-schemas.yaml#/components/parameters/StoreId'
    CorrelationId:
      $ref: '../../shared/common-schemas.yaml#/components/parameters/CorrelationId'
    Authorization:
      $ref: '../../shared/common-schemas.yaml#/components/parameters/Authorization'
    IdempotencyKey:
      $ref: '../../shared/common-schemas.yaml#/components/parameters/IdempotencyKey'
    CartCode:
      name: code
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    CartId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    CustomerId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    PromoCode:
      name: promoCode
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    Sku:
      name: sku
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    ReturnCart:
      name: body
      in: query
      required: false
      schema:
        type: boolean
        default: false
    OptionalCartCode:
      name: cart
      in: query
      required: false
      schema:
        type: string
    OptionalQuoteId:
      name: quote
      in: query
      required: false
      schema:
        type: string
        format: uuid

  schemas:
    AddCartItemRequest:
      type: object
      required:
        - product
        - quantity
      properties:
        product:
          type: string
          minLength: 1
        quantity:
          type: integer
          minimum: 1
        attributes:
          type: array
          items:
            $ref: "#/components/schemas/CartAttributeReference"
        promoCode:
          type: string

    UpdateCartItemRequest:
      type: object
      required:
        - product
        - quantity
      properties:
        product:
          type: string
        quantity:
          type: integer
          minimum: 0
        attributes:
          type: array
          items:
            $ref: "#/components/schemas/CartAttributeReference"
        promoCode:
          type: string

    MultiCartItemRequest:
      type: object
      required:
        - product
        - quantity
      properties:
        product:
          type: string
        quantity:
          type: integer
          minimum: 0
        attributes:
          type: array
          items:
            $ref: "#/components/schemas/CartAttributeReference"

    CartAttributeReference:
      type: object
      required:
        - id
      properties:
        id:
          type: integer
          format: int64

    AuthenticatedCheckoutRequest:
      type: object
      required:
        - currency
        - payment
        - customerAgreement
      properties:
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
        shippingQuoteId:
          type: string
          format: uuid
        payment:
          $ref: "#/components/schemas/PaymentRequest"
        comments:
          type: string
        customerAgreement:
          type: boolean

    AnonymousCheckoutRequest:
      type: object
      required:
        - currency
        - customer
        - payment
        - customerAgreement
      properties:
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
        customer:
          $ref: "#/components/schemas/AnonymousCustomer"
        shippingQuoteId:
          type: string
          format: uuid
        payment:
          $ref: "#/components/schemas/PaymentRequest"
        comments:
          type: string
        customerAgreement:
          type: boolean

    AnonymousCustomer:
      type: object
      required:
        - email
        - firstName
        - lastName
        - billing
      properties:
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        password:
          type: string
          format: password
        repeatPassword:
          type: string
          format: password
        billing:
          $ref: "#/components/schemas/Address"

    PaymentRequest:
      type: object
      required:
        - amount
        - paymentModule
        - paymentType
        - transactionType
        - paymentToken
      properties:
        amount:
          type: string
          pattern: "^[0-9]+(\\.[0-9]{1,4})?$"
        paymentModule:
          type: string
        paymentType:
          type: string
          enum:
            - CREDITCARD
            - PAYPAL
            - MONEYORDER
        transactionType:
          type: string
          enum:
            - INIT
            - AUTHORIZE
            - AUTHORIZECAPTURE
        paymentToken:
          type: string
          minLength: 1

    ShippingAddressRequest:
      type: object
      required:
        - postalCode
        - countryCode
      properties:
        postalCode:
          type: string
        countryCode:
          type: string
          minLength: 2
          maxLength: 2

    CartEnvelope:
      type: object
      required:
        - cart
      properties:
        cart:
          $ref: "#/components/schemas/Cart"

    Cart:
      type: object
      required:
        - id
        - code
        - status
        - items
        - currency
      properties:
        id:
          type: string
        code:
          type: string
        tenantId:
          type: string
          format: uuid
        storeId:
          type: string
          format: uuid
        customerId:
          type: string
        status:
          type: string
          enum:
            - Open
            - Completed
            - Obsolete
        submittedOrderId:
          type: string
          format: uuid
        promoCode:
          type: string
        promoAddedAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: "#/components/schemas/CartItem"
        subTotal:
          type: string
        total:
          type: string
        currency:
          type: string
          pattern: "^[A-Z]{3}$"

    CartItem:
      type: object
      required:
        - id
        - sku
        - quantity
        - unitPrice
        - subTotal
        - attributes
      properties:
        id:
          type: string
        productId:
          type: integer
          format: int64
        sku:
          type: string
        variantId:
          type: integer
          format: int64
        quantity:
          type: integer
          minimum: 1
        unitPrice:
          type: string
        subTotal:
          type: string
        obsolete:
          type: boolean
        attributes:
          type: array
          items:
            $ref: "#/components/schemas/CartAttributeReference"

    ShippingSummary:
      type: object
      required:
        - shippingRequired
        - options
      properties:
        quoteId:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time
        shippingRequired:
          type: boolean
        delivery:
          $ref: "#/components/schemas/Address"
        shipping:
          type: string
        handling:
          type: string
        shippingModule:
          type: string
        shippingOption:
          type: string
        shippingOptionCode:
          type: string
        freeShipping:
          type: boolean
        taxOnShipping:
          type: boolean
        options:
          type: array
          items:
            $ref: "#/components/schemas/ShippingOption"

    ShippingOption:
      type: object
      required:
        - code
        - price
        - currency
      properties:
        code:
          type: string
        name:
          type: string
        price:
          type: string
        currency:
          type: string
          pattern: "^[A-Z]{3}$"

    Address:
      type: object
      required:
        - firstName
        - lastName
        - address
        - city
        - countryCode
        - postalCode
      properties:
        firstName:
          type: string
        lastName:
          type: string
        company:
          type: string
        address:
          type: string
        city:
          type: string
        stateProvince:
          type: string
        countryCode:
          type: string
        postalCode:
          type: string
        phone:
          type: string

    TotalSummary:
      type: object
      required:
        - cartCode
        - currency
        - subTotal
        - discountTotal
        - shipping
        - handling
        - tax
        - grandTotal
        - components
      properties:
        cartCode:
          type: string
        currency:
          type: string
