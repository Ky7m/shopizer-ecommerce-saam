        Invokes the MS-12 shipping provider-validation boundary before saving
        encrypted configuration under SHIPPING_MODULES. This operation does not
        calculate a shipping quote or execute a carrier operation.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/StoreId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/OptionalIdempotencyKey'
        - $ref: '#/components/parameters/ModuleCode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModuleConfigurationRequest'
      responses:
        '200':
          description: Shipping module configuration saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShippingModuleDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ModuleNotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ModuleConfigurationInvalid'
        '503':
          $ref: '#/components/responses/ProviderUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

