openapi: 3.1.0
info:
  title: Content and Configuration API
  version: 1.0.0
  description: |
    API contract for MS-11 Content and Configuration.
    This contract is the single source of truth for paths, operation identifiers,
    field names, request and response shapes, status codes, and error codes.
    MS-11 owns CMS content, content-file metadata and orchestration, merchant
    configuration state, public configuration projection, and integration-module
    metadata. Payment and shipping provider execution remains outside this service.
servers:
  - url: http://localhost:{port}/api/v1
    variables:
      port:
        default: "8111"
x-service-id: MS-11
x-service-name: Content and Configuration
x-naming-conventions:
  fieldNaming: camelCase
  endpointNaming: kebab-case
  headerNaming: kebab-case
  enumValues: PascalCase
  queryParams: camelCase
x-global-headers:
  - name: x-tenant-id
    required: true
    description: Tenant isolation key. Must be a valid UUID.
    testValue: 00000000-0000-0000-0000-000000000001
  - name: x-store-id
    required: false
    description: Store isolation key for store-scoped operations. Required by store-scoped operations and must belong to x-tenant-id.
    testValue: 00000000-0000-0000-0000-000000000002
  - name: x-correlation-id
    required: true
    description: Distributed tracing identifier.
    testValue: 00000000-0000-0000-0000-000000000003
  - name: Authorization
    required: false
    description: Bearer token required for private and administrative operations.
    testValue: Bearer <test-admin-token>
  - name: x-language
    required: false
    description: ISO language code used for localized content projections.
    testValue: en
  - name: Idempotency-Key
    required: false
    description: Idempotency key for retryable mutations. Required where stated by the operation.
    testValue: ms11-test-idempotency-001

tags:
  - name: Content
  - name: Content Files
  - name: Folders
  - name: Configuration
  - name: Modules
  - name: Legacy Compatibility

paths:
  /content/pages:
    get:
      tags:
        - Content
      operationId: listPublicPages
      summary: List public page summaries
      description: |
        Lists page content for the selected tenant and store, ordered by ascending
        sortOrder and projected for the requested language. When language is absent,
        all available descriptions are returned.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/StoreId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/OptionalLanguageQuery'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/ContentPageCount'
      responses:
        '200':
          description: Page list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /private/content/pages:
    get:
      tags:
        - Content
      operationId: listPrivatePages
      summary: List page summaries for administration
      description: Lists store-scoped page content for an authorized administrator.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/StoreId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/OptionalLanguageQuery'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/ContentPageCount'
      responses:
        '200':
          description: Page list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /content/pages/{code}:
    get:
      tags:
        - Content
      operationId: getPublicPageByCode
      summary: Read a public page by content code
      description: |
        Reads a page by code within the selected store. With x-language, the
        response contains one localized description. Without x-language, it
        contains all available descriptions. The stored visibility value is
        returned; this code lookup does not apply the friendly-URL visibility
        predicate.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/StoreId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/OptionalLanguageHeader'
        - $ref: '#/components/parameters/ContentCode'
      responses:
        '200':
          description: Page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ContentNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /private/content/pages/{code}:
    get:
      tags:
        - Content
      operationId: getPrivatePageByCode
      summary: Read a page by content code for administration
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/StoreId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/OptionalLanguageHeader'
        - $ref: '#/components/parameters/ContentCode'
      responses:
        '200':
          description: Page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ContentNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /content/pages/name/{name}:
    get:
      tags:
        - Content
      operationId: getPublicPageByFriendlyUrl
      summary: Read visible page content by localized friendly URL
      description: |
        Resolves a page by friendly URL for the selected language and store.
        Only visible content is eligible. An invisible or unknown page is returned
        as CONTENT_NOT_FOUND.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/StoreId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/RequiredLanguageHeader'
        - name: name
          in: path
          required: true
          description: Localized friendly URL.
          schema:
            type: string
            minLength: 1
            maxLength: 120
      responses:
        '200':
          description: Visible page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ContentNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /private/content/boxes:
    get:
      tags:
        - Content
      operationId: listPrivateContentBoxes
      summary: List content boxes for administration
      description: |
        Lists store-scoped content boxes ordered by ascending sortOrder. A
        language-specific response applies the box description formatting rule
        that removes control characters and wraps the result in CDATA.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/StoreId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/OptionalLanguageQuery'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/ContentPageCount'
      responses:
        '200':
          description: Content-box list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /content/boxes:
    get:
      tags:
        - Content
      operationId: listPublicContentBoxes
      summary: List public content boxes
      description: Lists store-scoped content boxes using the public projection.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/StoreId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/OptionalLanguageQuery'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/ContentPageCount'
      responses:
        '200':
          description: Content-box list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /private/content/boxes/{code}:
    get:
      tags:
        - Content
      operationId: getPrivateContentBoxByCode
      summary: Read a content box by code for administration
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/StoreId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/OptionalLanguageHeader'
        - $ref: '#/components/parameters/ContentCode'
      responses:
        '200':
          description: Content box
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ContentNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /content/boxes/{code}:
    get:
      tags:
        - Content
      operationId: getPublicContentBoxByCode
      summary: Read a public content box by code
      description: |
        Reads a content box by code. With x-language, the selected description
        uses box-specific CDATA formatting. Without x-language, all descriptions
        are returned without applying the single-language wrapper to each entry.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/StoreId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/OptionalLanguageHeader'
        - $ref: '#/components/parameters/ContentCode'
      responses:
        '200':
          description: Content box
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ContentNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /private/content/page:
    post:
      tags:
        - Content
      operationId: createContentPage
      summary: Create a content page
      description: |
        Creates a page in the selected store. The operation assigns PAGE as the
        content type regardless of any compatibility field supplied by the client.
        Content codes are unique across pages, boxes, and sections within the store.
        Submitted descriptions replace the localized description collection.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/StoreId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePageRequest'
      responses:
        '201':
          description: Page created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityIdResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/ContentCodeConflict'
        '422':
          $ref: '#/components/responses/LanguageNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /private/content/page/{contentId}:
    put:
      tags:
        - Content
      operationId: replaceContentPage
      summary: Replace a content page
      description: |
        Replaces a page and its submitted localized descriptions in the selected
        store. The operation always persists PAGE and does not accept a client
        content type as a type-selection field. PUT is idempotent for the same
        tenant, store, content identifier, and request representation.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/StoreId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/OptionalIdempotencyKey'
        - $ref: '#/components/parameters/ContentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePageRequest'
      responses:
        '204':
          description: Page replaced successfully. The response body is empty.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ContentNotFound'
        '422':
          $ref: '#/components/responses/LanguageNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags:
        - Content
      operationId: deleteContentPage
      summary: Delete a content page
      description: Deletes a page only when its identifier belongs to the selected store.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/StoreId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/OptionalIdempotencyKey'
        - $ref: '#/components/parameters/ContentId'
      responses:
        '204':
          description: Page deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ContentNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /private/content/page/{code}/exists:
    get:
      tags:
        - Content
      operationId: pageCodeExists
      summary: Check page-code existence
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/StoreId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/ContentCode'
      responses:
        '200':
          description: Existence result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityExistsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /private/content/box:
    post:
      tags:
        - Content
      operationId: createContentBox
      summary: Create a content box
      description: |
        Creates a BOX item in the selected store. The operation ignores any
        compatibility contentType field and assigns BOX. Content codes are unique
        across all content types within the store.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/StoreId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBoxRequest'
      responses:
        '201':
          description: Content box created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityIdResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/ContentCodeConflict'
        '422':
          $ref: '#/components/responses/LanguageNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /private/content/box/{contentId}:
    put:
      tags:
        - Content
      operationId: replaceContentBox
      summary: Replace a content box
      description: |
        Replaces a BOX item and its submitted localized descriptions. Omitted
        descriptions are removed from the submitted collection. PUT is idempotent
        for the same tenant, store, content identifier, and request representation.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/StoreId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/OptionalIdempotencyKey'
        - $ref: '#/components/parameters/ContentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBoxRequest'
      responses:
        '204':
          description: Content box replaced successfully. The response body is empty.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ContentNotFound'
        '422':
          $ref: '#/components/responses/LanguageNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags:
        - Content
      operationId: deleteContentBox
      summary: Delete a content box
      description: Deletes a content box only in its owning store.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/StoreId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/OptionalIdempotencyKey'
        - $ref: '#/components/parameters/ContentId'
      responses:
        '204':
          description: Content box deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ContentNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /private/content/box/{code}/exists:
    get:
      tags:
        - Content
      operationId: contentBoxCodeExists
      summary: Check content-box code existence
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/StoreId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/ContentCode'
      responses:
        '200':
          description: Existence result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityExistsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /private/content/files:
    get:
      tags:
        - Content Files
      operationId: listContentFiles
      summary: List content files
      description: |
        Lists files in the selected store, content-type namespace, and folder.
        The selected provider must support listing. Unsupported listing returns
        PROVIDER_CAPABILITY_UNSUPPORTED rather than a fabricated empty list.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/StoreId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/RequiredFileContentType'
        - $ref: '#/components/parameters/OptionalFolderPath'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/FilePageCount'
      responses:
        '200':
          description: File list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '501':
          $ref: '#/components/responses/ProviderCapabilityUnsupported'
        '503':
          $ref: '#/components/responses/ProviderUnavailable'

    post:
      tags:
        - Content Files
      operationId: uploadContentFile
      summary: Upload a generic content file
      description: |
        Uploads one file using MIME-major-component classification when the
        content type is omitted. Same-name writes replace the object in the same
        store, content-type, and folder namespace.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/StoreId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GenericFileUploadRequest'
      responses:
        '201':
          description: File uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '501':
          $ref: '#/components/responses/ProviderCapabilityUnsupported'
        '503':
          $ref: '#/components/responses/ProviderUnavailable'

  /private/content/list:
    get:
      tags:
        - Content Files
      operationId: listImageManagerFiles
      summary: List file-manager images
      description: |
        Returns image entries for the selected store and IMAGE namespace,
        including generated static-image paths.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/StoreId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/OptionalParentPath'
      responses:
        '200':
          description: Image listing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageFileListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '501':
          $ref: '#/components/responses/ProviderCapabilityUnsupported'
        '503':
          $ref: '#/components/responses/ProviderUnavailable'

  /private/content/folder:
    get:
      tags:
        - Content Files
      operationId: getImageFolderProjection
      summary: Read the image-folder projection
      description: Returns the provider-backed image folder projection.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/StoreId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/OptionalFolderPath'
      responses:
        '200':
          description: Image folder projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentFolderResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '501':
          $ref: '#/components/responses/ProviderCapabilityUnsupported'
        '503':
          $ref: '#/components/responses/ProviderUnavailable'

  /private/content/images/add:
    post:
      tags:
        - Content Files
      operationId: uploadFileManagerImage
      summary: Upload a file-manager image
      description: |
        Validates qqfilename before invoking the storage boundary. Invalid names
        are rejected with INVALID_FILENAME and preventRetry true.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/StoreId'
        - $ref: '#/components/parameters/CorrelationId'
