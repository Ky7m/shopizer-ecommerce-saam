components:
  parameters:
    TenantId:
      name: x-tenant-id
      in: header
      required: true
      description: Tenant isolation key.
      schema:
        type: string
        format: uuid
    StoreId:
      name: x-store-id
      in: header
      required: true
      description: Store isolation key within the tenant.
      schema:
        type: string
        format: uuid
    CorrelationId:
      name: x-correlation-id
      in: header
      required: true
      description: Distributed tracing identifier.
      schema:
        type: string
        format: uuid
    Authorization:
      name: Authorization
      in: header
      required: true
      description: Bearer token for authenticated operations.
      schema:
        type: string
        pattern: '^Bearer .+$'
    OptionalLanguageHeader:
      name: x-language
      in: header
      required: false
      description: ISO language code for a localized projection.
      schema:
        type: string
        minLength: 2
        maxLength: 10
        pattern: '^[A-Za-z]{2,10}$'
    RequiredLanguageHeader:
      name: x-language
      in: header
      required: true
      description: ISO language code required for friendly-URL lookup.
      schema:
        type: string
        minLength: 2
        maxLength: 10
        pattern: '^[A-Za-z]{2,10}$'
    OptionalIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Optional key for safe replay of an idempotent mutation.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Required key for retryable creation, upload, rename, or replacement.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    ContentId:
      name: contentId
      in: path
      required: true
      description: Content identifier.
      schema:
        type: string
        format: uuid
    ContentCode:
      name: code
      in: path
      required: true
      description: Store-scoped content code.
      schema:
        type: string
        minLength: 1
        maxLength: 100
    ModuleCode:
      name: code
      in: path
      required: true
      description: Integration-module code.
      schema:
        type: string
        minLength: 1
        maxLength: 100
    ConfigurationKey:
      name: key
      in: path
      required: true
      description: Merchant configuration key.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    FileName:
      name: fileName
      in: path
      required: true
      description: Basename of the content file.
      schema:
        type: string
        minLength: 1
        pattern: '^(?!.*\.\.)[^/\\]+$'
    Page:
      name: page
      in: query
      required: false
      description: Zero-based page index.
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0
    ContentPageCount:
      name: count
      in: query
      required: false
      description: Number of content items per page.
      schema:
        type: integer
        format: int32
        minimum: 1
        default: 20
    FilePageCount:
      name: count
      in: query
      required: false
      description: Number of files per page.
      schema:
        type: integer
        format: int32
        minimum: 1
        default: 100
    OptionalLanguageQuery:
      name: language
      in: query
      required: false
      description: Target language. When absent, all descriptions are returned.
      schema:
        type: string
        minLength: 2
        maxLength: 10
        pattern: '^[A-Za-z]{2,10}$'
    RequiredFileContentType:
      name: contentType
      in: query
      required: true
      description: File-content namespace.
      schema:
        $ref: '#/components/schemas/FileContentType'
    OptionalFolderPath:
      name: path
      in: query
      required: false
      description: Linux-style folder path.
      schema:
        type: string
        default: /
        pattern: '^/$|^(/[A-Za-z0-9_-]+)+$'
    OptionalParentPath:
      name: parentPath
      in: query
      required: false
      description: URL-encoded image path. Blank values resolve to the root path.
      schema:
        type: string
        default: /
    RetiredOperationRequest:
      name: unused
      in: query
      required: false
      schema:
        type: string

  responses:
    BadRequest:
      description: Invalid request context or payload.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication required.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Caller is not authorized for the selected tenant or store.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ContentNotFound:
      description: Content identifier, code, or friendly URL was not found in the selected store.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    FileNotFound:
      description: File was not found in the selected namespace.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    FolderNotFound:
      description: Folder was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ModuleNotFound:
      description: Module is unavailable to the selected store.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ConfigurationNotFound:
      description: Merchant configuration key was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ConfigurationUnavailable:
      description: No usable merchant configuration is available.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ConfigurationParseError:
      description: Merchant configuration could not be parsed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ContentCodeConflict:
      description: Content code already exists in the selected store.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Mutation conflicts with existing state or an idempotency replay.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnprocessableEntity:
      description: Domain validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    LanguageNotFound:
      description: Submitted language code does not resolve in shared reference data.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidFilename:
      description: File-manager filename validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidFolderPath:
      description: Folder path is not valid Linux-style directory syntax.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ModuleConfigurationInvalid:
      description: Provider validation rejected module keys or options.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ProviderCapabilityUnsupported:
      description: Selected provider does not support the requested operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ProviderUnavailable:
      description: Selected provider or provider-validation boundary is unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    LegacyOperationRetired:
      description: Legacy operation was explicitly nonfunctional and is retired.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
        - message
        - statusCode
        - timestamp
        - correlationId
      properties:
        error:
          type: string
          description: Stable machine-readable error code.
          enum:
            - INVALID_REQUEST_CONTEXT
            - INVALID_CONTENT_REQUEST
            - INVALID_FILENAME
            - INVALID_FOLDER_PATH
            - LANGUAGE_NOT_FOUND
            - CONTENT_CODE_CONFLICT
            - CONTENT_NOT_FOUND
            - FILE_NOT_FOUND
            - FOLDER_NOT_FOUND
            - MODULE_NOT_FOUND
            - CONFIGURATION_NOT_FOUND
            - CONFIGURATION_UNAVAILABLE
            - CONFIGURATION_PARSE_ERROR
            - MODULE_CONFIGURATION_INVALID
            - PROVIDER_UNAVAILABLE
            - PROVIDER_CAPABILITY_UNSUPPORTED
            - LEGACY_OPERATION_RETIRED
            - FORBIDDEN_STORE_SCOPE
            - CONFLICT
            - INTERNAL_ERROR
        message:
          type: string
        statusCode:
          type: integer
          format: int32
        timestamp:
          type: string
          format: date-time
        correlationId:
          type: string
          format: uuid
        details:
          type: object
          additionalProperties: true

    PaginationInfo:
      type: object
      additionalProperties: false
      required:
        - page
        - pageSize
        - totalItems
        - totalPages
      properties:
        page:
          type: integer
          format: int32
          minimum: 0
        pageSize:
          type: integer
          format: int32
          minimum: 1
        totalItems:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          format: int32
          minimum: 0

    ContentDescription:
      type: object
      additionalProperties: false
      required:
        - id
        - language
        - name
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        language:
          type: string
          minLength: 2
          maxLength: 10
        name:
          type: string
          minLength: 1
          maxLength: 120
        title:
          type: [string, "null"]
          maxLength: 100
        description:
          type: [string, "null"]
        friendlyUrl:
          type: [string, "null"]
          maxLength: 120
        metaKeywords:
          type: [string, "null"]
        metaTitle:
          type: [string, "null"]
          maxLength: 100
        metaDescription:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
        modifiedBy:
          type: [string, "null"]
          maxLength: 60
          readOnly: true

    ContentDescriptionInput:
      type: object
      additionalProperties: false
      required:
        - language
        - name
      properties:
        language:
          type: string
          minLength: 2
          maxLength: 10
          pattern: '^[A-Za-z]{2,10}$'
        name:
          type: string
          minLength: 1
          maxLength: 120
        title:
          type: [string, "null"]
          maxLength: 100
        description:
          type: [string, "null"]
        friendlyUrl:
          type: [string, "null"]
          maxLength: 120
        metaKeywords:
          type: [string, "null"]
        metaDescription:
          type: [string, "null"]

    ContentItem:
      type: object
      additionalProperties: false
      required:
        - id
        - code
        - contentType
        - visible
        - sortOrder
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          minLength: 1
          maxLength: 100
        contentType:
          type: string
          enum:
            - Box
            - Page
            - Section
        contentPosition:
          type: [string, "null"]
          enum:
            - Left
            - Right
            - null
        linkToMenu:
          type: boolean
        productGroup:
          type: [string, "null"]
        sortOrder:
          type: integer
          format: int32
        visible:
          type: boolean
        description:
          anyOf:
            - $ref: '#/components/schemas/ContentDescription'
            - type: "null"
        descriptions:
          type: array
          items:
            $ref: '#/components/schemas/ContentDescription'
        tenantId:
          type: string
          format: uuid
          readOnly: true
        storeId:
          type: string
          format: uuid
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
        modifiedBy:
          type: [string, "null"]
          maxLength: 60
          readOnly: true

    ContentListResponse:
      type: object
      additionalProperties: false
      required:
        - items
        - page
        - count
        - number
        - totalPages
        - recordsTotal
        - recordsFiltered
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ContentItem'
        page:
          type: integer
          format: int32
          minimum: 0
        count:
          type: integer
          format: int32
          minimum: 1
        number:
          type: integer
          format: int32
          minimum: 0
        totalPages:
          type: integer
          format: int32
          minimum: 0
        recordsTotal:
          type: integer
          format: int64
          minimum: 0
        recordsFiltered:
          type: integer
          format: int64
          minimum: 0
        pagination:
          $ref: '#/components/schemas/PaginationInfo'

    CreatePageRequest:
      type: object
      additionalProperties: false
